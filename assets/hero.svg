<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Thiago Costa — Full-Stack Engineer · Founder · Available for remote contract">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b2c"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#fbbf24;#34d399;#60a5fa;#a78bfa" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#fbbf24;#34d399;#60a5fa;#a78bfa;#ec4899" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fb7185">
        <animate attributeName="stop-color" values="#fb7185;#34d399;#60a5fa;#a78bfa;#ec4899;#fb7185" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;6;3" dur="4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.06"/>
    </pattern>

    <clipPath id="nameWipe">
      <rect x="0" y="120" width="0" height="100">
        <animate attributeName="width" from="0" to="1200" dur="1.6s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="bracketsClip">
      <rect x="0" y="0" width="1200" height="360"/>
    </clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g opacity="0.5">
    <text x="120" y="80" font-family="JetBrains Mono, monospace" font-size="14" fill="#a78bfa">{ }
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="1060" y="70" font-family="JetBrains Mono, monospace" font-size="14" fill="#ec4899">=&gt;
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="180" y="290" font-family="JetBrains Mono, monospace" font-size="14" fill="#60a5fa">&lt; /&gt;
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="1000" y="300" font-family="JetBrains Mono, monospace" font-size="14" fill="#fbbf24">{ }
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-13;0,0" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="540" y="48" font-family="JetBrains Mono, monospace" font-size="12" fill="#34d399">·
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
    </text>
    <circle cx="80" cy="200" r="1.6" fill="#a78bfa">
      <animate attributeName="cy" values="200;180;200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1130" cy="180" r="1.4" fill="#60a5fa">
      <animate attributeName="cy" values="180;165;180" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="330" r="1.6" fill="#ec4899">
      <animate attributeName="cy" values="330;320;330" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#a78bfa" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M 90 110 L 60 110 L 60 250 L 90 250" stroke-dasharray="280" stroke-dashoffset="280">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.4s" begin="0s" fill="freeze"/>
    </path>
    <path d="M 1110 110 L 1140 110 L 1140 250 L 1110 250" stroke-dasharray="280" stroke-dashoffset="280">
      <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.4s" begin="0s" fill="freeze"/>
    </path>
  </g>

  <g transform="translate(600, 86)" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.1s" fill="freeze"/>
      <text font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" letter-spacing="6" fill="#9ca3af">&lt;FULL-STACK · FOUNDER /&gt;</text>
      <rect x="135" y="-11" width="2" height="14" fill="#a78bfa">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g clip-path="url(#nameWipe)" text-anchor="middle">
    <g filter="url(#softGlow)">
      <text x="600" y="190" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="900" fill="url(#nameGrad)" letter-spacing="-2">THIAGO COSTA</text>
    </g>
    <text x="600" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="84" font-weight="900" fill="url(#shimmerGrad)" letter-spacing="-2" opacity="0.9">THIAGO COSTA</text>
  </g>

  <g transform="translate(600, 210)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.6s" fill="freeze"/>
    <line x1="-220" y1="0" x2="220" y2="0" stroke="url(#lineGrad)" stroke-width="2">
      <animate attributeName="x1" values="-220;-260;-220" dur="5s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="x2" values="220;260;220" dur="5s" repeatCount="indefinite" begin="1.8s"/>
    </line>
  </g>

  <g transform="translate(600, 250)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.9s" fill="freeze"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" letter-spacing="3">NEXT.JS  ·  TYPESCRIPT  ·  ENTERPRISE AI  ·  6+ YEARS</text>
  </g>

  <g transform="translate(600, 282)" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.2s" fill="freeze"/>
    <text font-family="JetBrains Mono, monospace" font-size="11" fill="#6b7280" letter-spacing="3">50+ PRODUCTS  ·  140+ CLIENTS  ·  4.9★ RATING</text>
  </g>

  <g transform="translate(600, 322)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.4s" fill="freeze"/>
    <rect x="-200" y="-19" width="400" height="38" rx="19" fill="#10b98112" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="-172" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="r" values="4.5;6.5;4.5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-172" cy="0" r="4.5" fill="#10b981" opacity="0.5">
      <animate attributeName="r" values="4.5;13;4.5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="3">OPEN FOR REMOTE CONTRACT  ·  USD / EUR</text>
  </g>
</svg>
